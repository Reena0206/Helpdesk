{% extends 'base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6 col-xl-5">
    <div class="card">
      <div class="card-body p-4">
        <div class="stat-icon tone-primary mb-3"><i class="bi bi-key"></i></div>
        <h1 class="h4 mb-1">Change password</h1>
        <p class="text-muted">Enter your current password, then choose a new one.</p>
<form method="post" novalidate>
  {% csrf_token %}
  {% include 'partials/form_fields.html' %}
  <button type="submit" class="btn btn-primary w-100 py-2">Update password</button>
</form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
