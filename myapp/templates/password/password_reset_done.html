{% extends 'auth_base.html' %}
{% block title %}Check your inbox{% endblock %}
{% block auth_content %}
<div class="mb-4">
  <div class="stat-icon tone-success mb-3"><i class="bi bi-envelope-check"></i></div>
  <h1 class="h3 mb-1">Check your inbox</h1>
  <p class="text-muted mb-0">If an account exists for that email, a password reset link is on its way.</p>
</div>
<div class="alert alert-info small"><i class="bi bi-terminal"></i> In development, the email is printed in the terminal running <code>runserver</code>.</div>
<a href="{% url 'login' %}" class="btn btn-primary w-100 py-2">Back to login</a>
{% endblock %}
