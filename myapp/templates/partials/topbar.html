{% load helpdesk %}
<header class="topbar">
  <button class="btn btn-light-subtle btn-icon d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Open menu">
    <i class="bi bi-list fs-5"></i>
  </button>

  <form class="topbar-search d-none d-sm-block" action="{% url 'ticket_list' %}" method="get" role="search">
    <i class="bi bi-search"></i>
    <input id="global-search" class="form-control" type="search" name="q" value="{{ request.GET.q }}" placeholder="Search tickets by number, title or text…" aria-label="Search tickets">
    <kbd class="d-none d-md-inline">/</kbd>
  </form>

  <div class="ms-auto d-flex align-items-center gap-2">
    <a href="{% url 'ticket_list' %}" class="btn btn-light-subtle btn-icon d-sm-none" aria-label="Search"><i class="bi bi-search"></i></a>
    <button class="btn btn-light-subtle btn-icon" type="button" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
      <i class="bi bi-moon-stars theme-icon-light"></i><i class="bi bi-sun theme-icon-dark"></i>
    </button>
    <a href="{% url 'ticket_create' %}" class="btn btn-primary d-none d-md-inline-flex align-items-center gap-1"><i class="bi bi-plus-lg"></i> New ticket</a>
    <a href="{% url 'ticket_create' %}" class="btn btn-primary btn-icon d-md-none" aria-label="New ticket"><i class="bi bi-plus-lg"></i></a>

    <div class="dropdown">
      <a class="user-menu-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        {% avatar user %}
        <span class="d-none d-md-block lh-sm text-start">
          <span class="d-block fw-semibold small">{{ user|display_name }}</span>
          <span class="d-block text-muted" style="font-size:.72rem">{{ current_profile.get_role_display }}</span>
        </span>
        <i class="bi bi-chevron-down small text-muted d-none d-md-inline"></i>
      </a>
      <ul class="dropdown-menu dropdown-menu-end">
        <li class="px-3 py-2 border-bottom mb-1">
          <div class="fw-semibold">{{ user|display_name }}</div>
          <div class="small text-muted">{{ user.email|default:user.username }}</div>
        </li>
        <li><a class="dropdown-item" href="{% url 'profile' %}"><i class="bi bi-person"></i> My profile</a></li>
        <li><a class="dropdown-item" href="{% url 'wallet' %}"><i class="bi bi-wallet2"></i> Wallet</a></li>
        <li><a class="dropdown-item" href="{% url 'password_change' %}"><i class="bi bi-key"></i> Change password</a></li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <form method="post" action="{% url 'logout' %}">{% csrf_token %}
            <button class="dropdown-item text-danger" type="submit"><i class="bi bi-box-arrow-right"></i> Log out</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</header>
