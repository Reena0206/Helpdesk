{% extends 'base.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    {% block content %}
    <div class="col-4 offset-4">
        <h1>Update Profile</h1>
        <form action="" method="post">
            {% csrf_token %}
            {{ form }}
            <br>
            <button type="submit" class="btn btn-secondary">Save</button>

        </form>
    </div>
    {% endblock %}
</body>
</html>
