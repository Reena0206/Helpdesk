{% extends 'base.html' %}
{% block content %}
    <div class="col-4 offset-4">
        <h1>Login Page</h1>
        <form action="" method="post">
            {% csrf_token %}
            {{ form }}
            <br>
            <button type="submit" class="btn btn-secondary">Login</button>
            <a href="{% url 'password_reset' %}">Forget Password?</a>
        </form>
    </div>
{% endblock %}
